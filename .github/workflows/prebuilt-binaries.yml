name: Prebuilt Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-prebuilt (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bin handshacke --bin hs-cli

      - name: Package Unix artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          short_sha="${GITHUB_SHA::12}"
          archive="prebuilt-${short_sha}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${archive}" handshacke hs-cli

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $archive = "prebuilt-$shortSha-${{ matrix.target }}.${{ matrix.archive_ext }}"
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/handshacke.exe,target/${{ matrix.target }}/release/hs-cli.exe `
            -DestinationPath "dist/$archive" `
            -Force

      - name: Write build metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/prebuilt-metadata.txt <<EOF
          sha=${GITHUB_SHA}
          ref=${GITHUB_REF}
          ref_name=${GITHUB_REF_NAME}
          run_id=${GITHUB_RUN_ID}
          run_number=${GITHUB_RUN_NUMBER}
          target=${{ matrix.target }}
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Upload prebuilt artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
